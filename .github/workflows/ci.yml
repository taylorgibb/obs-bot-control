name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Test the Protocol
        run: make test
      - name: Package the App
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
        run: make package
      - name: Check the App Is Universal
        run: |
          info="$(lipo -info "build/OBS Bot Control.app/Contents/MacOS/OBSBotControl")"
          echo "$info"
          echo "$info" | grep -q arm64
          echo "$info" | grep -q x86_64
      - uses: actions/upload-artifact@v5
        with:
          name: obs-bot-control
          path: |
            build/OBS-Bot-Control.zip
            build/OBS-Bot-Control.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: obs-bot-control
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 -c OBS-Bot-Control.zip.sha256
          gh release create "$GITHUB_REF_NAME" OBS-Bot-Control.zip OBS-Bot-Control.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
